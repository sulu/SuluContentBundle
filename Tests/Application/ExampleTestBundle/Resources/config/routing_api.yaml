example_test.get_examples:
    path: '/admin/api/examples.{_format}'
    methods: GET
    controller: 'example_test.example_controller::cgetAction'
    format: json
    defaults:
        _format: json
        options:
            api_dimension_listener: true
    requirements:
        _format: json|csv

example_test.get_example:
    path: '/admin/api/examples/{id}.{_format}'
